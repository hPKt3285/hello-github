name: README checks

on:
  push:
  pull_request:

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show recent commits
        run: git log --oneline -5

      - name: Check README structure
        run: bash scripts/check-readme.sh

  readme-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check README structure
        shell: bash
        run: bash scripts/check-readme.sh
